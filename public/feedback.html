<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1055">
<meta name="robots" content="noindex">
<title>Feedback da formação</title>
<link rel="stylesheet" href="common.css">
<style>
  body { -webkit-tap-highlight-color: transparent; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }
  .logo { font-weight: 700; font-size: 1.5em; text-align: center; margin: 8px 0 4px; } .logo span { color: #ffd93d; }
  .middle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  .middle p { margin: 0; }
  .big-emoji { font-size: 80px; }
  h1 { font-size: 1.7em; margin: .2em 0; line-height: 1.2; }
  .intro { background: rgba(255,255,255,.12); border-radius: 16px; padding: 14px 16px; margin: 6px 0 4px; line-height: 1.45; white-space: pre-line; }
  .anon { display: flex; gap: 10px; align-items: flex-start; background: #1d1433; border-radius: 14px; padding: 12px 14px; margin: 10px 0 6px; font-size: .95em; line-height: 1.4; }
  .anon b { color: #ffd93d; }
  .progress { position: sticky; top: 0; z-index: 5; margin: 8px -16px 6px; padding: 10px 16px; background: rgba(29,20,51,.92); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: .95em; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #22c55e; border-radius: 99px; transition: width .3s; }
  .q { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: 0 6px 18px rgba(0,0,0,.18); scroll-margin-top: 70px; transition: box-shadow .2s; }
  .q.missing { box-shadow: 0 0 0 4px #ff5d73, 0 6px 18px rgba(0,0,0,.18); }
  .q-t { font-weight: 700; font-size: 1.1em; line-height: 1.3; overflow-wrap: anywhere; }
  .q-t .n { color: var(--d); margin-right: 4px; }
  .q-t .req { color: #e11d48; } .q-hint { color: var(--muted); font-size: .88em; margin: 4px 0 0; font-weight: 400; }
  .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .scale button { aspect-ratio: 1; max-height: 64px; width: 100%; border-radius: 14px; background: #f1edf8; color: var(--ink); font-size: 1.4em; font-weight: 700; }
  .scale-l { display: flex; justify-content: space-between; gap: 10px; font-size: .82em; color: var(--muted); margin-top: 6px; }
  .scale-l span:last-child { text-align: right; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opts.two { display: grid; grid-template-columns: 1fr 1fr; }
  .opts button { text-align: left; padding: 13px 14px; border-radius: 14px; background: #f1edf8; color: var(--ink); font-weight: 600; min-height: 48px; display: flex; gap: 10px; align-items: center; overflow-wrap: anywhere; }
  .opts.two button { justify-content: center; text-align: center; }
  .opts button .box { width: 22px; height: 22px; flex: none; border: 2px solid #b9b0cc; border-radius: 50%; display: grid; place-items: center; font-size: 14px; color: #fff; }
  .opts.multi button .box { border-radius: 6px; }
  button.sel { background: var(--d) !important; color: #fff !important; }
  button.sel .box { border-color: #fff; background: rgba(255,255,255,.25); }
  textarea { width: 100%; margin-top: 12px; border: 2px solid #e5e0ef; border-radius: 14px; padding: 12px; font-size: 1.05em; resize: vertical; min-height: 110px; color: var(--ink); display: block; }
  textarea:focus { outline: none; border-color: var(--d); }
  .count { text-align: right; color: var(--muted); font-size: .8em; margin-top: 4px; }
  .send { width: 100%; font-size: 1.2em; margin-top: 10px; padding: .9em; }
  .code-in { width: 100%; padding: 14px; border-radius: 14px; border: 0; text-align: center; font-size: 1.8em; letter-spacing: .25em; text-transform: uppercase; font-weight: 700; }
  .link { background: none; color: #fff; text-decoration: underline; opacity: .8; font-size: .9em; padding: 10px; }
</style>
</head>
<body>
<main id="app"><div class="middle"><div class="big-emoji">💬</div><p>A carregar…</p></div></main>
<script src="common.js"></script>
<script src="feedback-page.js"></script>
</body>
</html>
