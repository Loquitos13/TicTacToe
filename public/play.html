<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2b1055">
<title>Quiz</title>
<link rel="stylesheet" href="common.css">
<style>
  body { -webkit-tap-highlight-color: transparent; user-select: none; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }
  h1 { font-size: 2em; margin: .3em 0; }
  .logo { font-weight: 700; font-size: 1.6em; letter-spacing: .5px; text-align: center; margin: 8px 0 4px; }
  .logo span { color: #ffd93d; }
  .screen { flex: 1; display: flex; flex-direction: column; }
  .middle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  .big-emoji { font-size: 84px; }
  .search { width: 100%; padding: 14px 16px; border-radius: 14px; border: 0; font-size: 1.05em; margin: 10px 0 14px; }
  .code-in { text-align: center; font-size: 1.8em; letter-spacing: .25em; text-transform: uppercase; font-weight: 700; }
  .middle p { margin: 0; }
  .team-chip { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tc); box-shadow: 0 0 0 2px #fff; font-size: 15px; }
  .team-card { width: 100%; background: var(--tc); color: #fff; border-radius: 18px; padding: 12px 16px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.2); text-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .team-name { font-size: 1.4em; font-weight: 800; } .team-mates { opacity: .95; margin-top: 2px; }
  .cloud-in { display: flex; flex-direction: column; gap: 0; margin-top: 6px; } .cloud-in .search { margin: 0 0 10px; }
  .gw { display: flex; flex-direction: column; gap: 5px; align-items: center; margin: 6px 0; }
  .gw-row { display: flex; gap: 5px; }
  .gw-c { width: min(48px, calc((100vw - 40px - (var(--len) - 1) * 5px) / var(--len))); aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; border: 2px solid rgba(255,255,255,.35); font-weight: 800; font-size: min(1.6em, calc((100vw - 40px) / var(--len) * .5)); color: #fff; text-transform: uppercase; }
  .gw-c.typed { border-color: #fff; background: rgba(255,255,255,.15); }
  .gw-c.g { background: #22c55e; border-color: #22c55e; } .gw-c.y { background: #f59e0b; border-color: #f59e0b; } .gw-c.r { background: #ef4444; border-color: #ef4444; }
  .gw-c.flip { animation: gwFlip .45s both; } @keyframes gwFlip { 0% { transform: rotateX(90deg); } 100% { transform: none; } }
  .gw-msg { text-align: center; font-weight: 700; margin: 4px 0 8px; }
  .kb { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; user-select: none; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .kb-k { flex: 1; max-width: 42px; height: 50px; border-radius: 8px; background: rgba(255,255,255,.85); color: var(--ink); font-weight: 800; font-size: 1.05em; padding: 0; }
  .kb-k.wide { max-width: 64px; flex: 1.5; font-size: .95em; } .kb-k.go { background: #ffd93d; }
  .kb-k.g { background: #22c55e; color: #fff; } .kb-k.y { background: #f59e0b; color: #fff; } .kb-k.r { background: #ef4444; color: #fff; opacity: .8; }
  @media (max-width: 360px) { .kb-k { height: 44px; font-size: .95em; } .kb-row { gap: 3px; } }
  .scr-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 8px 0 14px; }
  .scr-word { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .scr-slot { width: 38px; height: 46px; border-radius: 10px; background: rgba(255,255,255,.15); border: 2px dashed rgba(255,255,255,.6); color: #fff; font-size: 1.4em; font-weight: 800; padding: 0; }
  .scr-slot.on { background: #fff; color: var(--ink); border: 0; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .scr-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .scr-t { width: 50px; height: 54px; border-radius: 12px; background: #ffd93d; color: var(--ink); font-size: 1.6em; font-weight: 800; box-shadow: 0 5px 0 rgba(0,0,0,.25); padding: 0; }
  .scr-t.used { opacity: .2; box-shadow: none; }
  @media (max-width: 360px) { .scr-slot { width: 32px; height: 40px; } .scr-t { width: 44px; height: 48px; } }
  .cw-wrap { display: flex; justify-content: center; margin: 6px 0 10px; overflow-x: auto; }
  .cw-grid { display: grid; grid-template-columns: repeat(var(--cols), var(--cs)); grid-auto-rows: var(--cs); gap: 2px; }
  .cw-grid.phone { --cs: min(34px, calc((100vw - 40px) / var(--cols))); }
  .cw-cell { position: relative; background: #fff; color: var(--ink); border-radius: 4px; display: grid; place-items: center; font-weight: 800; font-size: calc(var(--cs) * .58); cursor: pointer; }
  .cw-cell.on { background: #fff3b0; box-shadow: inset 0 0 0 2px #f59e0b; }
  .cw-cell sup { position: absolute; top: 1px; left: 2px; font-size: max(8px, calc(var(--cs) * .28)); color: #6b5b95; line-height: 1; }
  .cw-list { display: flex; flex-direction: column; gap: 8px; }
  .cw-q { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; border: 2px solid transparent; }
  .cw-q.on { border-color: #ffd93d; background: rgba(255,255,255,.2); } .cw-q.done .cw-q-t b::after { content: ' ✓'; color: #86efac; }
  .cw-q-t { font-size: .95em; line-height: 1.3; overflow-wrap: anywhere; } .cw-q-t small { opacity: .75; }
  .cw-in { width: 100%; margin-top: 6px; border: 0; border-radius: 10px; padding: 9px 12px; font-size: 1.15em; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .rank-item { display: flex; align-items: center; gap: 10px; color: #fff; border-radius: 16px; padding: 12px 14px; min-height: 58px; font-weight: 600; font-size: 1.05em; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.25); opacity: .92; overflow-wrap: anywhere; }
  .rank-item.on { opacity: 1; box-shadow: 0 0 0 3px #fff, 0 5px 0 rgba(0,0,0,.25); }
  .rank-n { flex: none; width: 2.2em; height: 2.2em; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-weight: 800; }
  .rank-item.on .rank-n { background: #fff; color: var(--ink); }
  .rank-t { flex: 1; min-width: 0; }
  .join-err { background: #fff3cd; color: #7a4b00; border-radius: 12px; padding: 10px 14px; margin: -6px 0 12px !important; text-align: left; font-weight: 600; line-height: 1.35; }
  .ph-demo { height: 150px; display: grid; place-items: end center; }
  .ph-demo.small .dancer { --s: .7; }
  .ph-demo.small { height: 115px; }
  .cam-frame { position: relative; width: min(78vw, 300px); aspect-ratio: 1; border-radius: 24px; overflow: hidden; background: rgba(0,0,0,.35); }
  .cam-frame video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .cam-ring { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 0 46%, rgba(20,10,40,.6) 46.5%); }
  .cam-ring::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: 3px dashed rgba(255,255,255,.85); }
  .shoot { width: 100%; font-size: 1.2em; }
  .prev-row { display: flex; align-items: center; gap: 16px; }
  .prev-circle { width: min(52vw, 200px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 5px solid #fff; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .retake { padding: 12px 14px; line-height: 1.2; width: 100%; }
  .retake-col { display: flex; flex-direction: column; gap: 10px; }
  .review { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
  .rv-item { background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; border-left: 6px solid #bbb; }
  .rv-item.ok { border-left-color: var(--ok); } .rv-item.bad { border-left-color: var(--bad); }
  .rv-q { font-weight: 600; } .rv-a { color: #166534; font-weight: 600; margin-top: 4px; } .rv-m { color: var(--muted); font-size: .92em; margin-top: 2px; }
  .ex-top { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; font-weight: 600; }
  .ex-clock { font-size: 1.5em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ex-clock.hurry { color: #ffd93d; animation: pulse 1s infinite; }
  .ex-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: center; }
  .ex-chip { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; font-weight: 700; }
  .ex-chip.done { background: #22c55e; } .ex-chip.cur { outline: 3px solid #ffd93d; }
  .ex-answers { flex: none; margin-top: 12px; }
  .ex-answers .ans { min-height: 90px; }
  .ans.sel { outline: 5px solid #fff; transform: scale(1.02); }
  .ans.unsel { opacity: .55; }
  .ex-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .ex-nav .btn { flex: 1; }
  .ex-submit-link { margin-top: 10px; align-self: center; font-size: .9em; }
  .on-screen { background: rgba(255,255,255,.95); color: var(--ink); border-radius: 16px; padding: 14px 16px; text-align: center; font-size: 1.05em; line-height: 1.4; }
  .letters-only .ans { font-size: 3.2em; }
  .letters-only .ans .letter { background: transparent; width: auto; height: auto; }
  .scale-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale-btns .ans { min-height: 90px; font-size: 2.2em; padding: 0; }
  .scale-labels { display: flex; justify-content: space-between; font-size: .9em; opacity: .9; margin-top: 6px; }
  .open-in { width: 100%; border-radius: 14px; border: 0; padding: 12px; margin-top: 12px; display: block; font-size: 1.1em; resize: vertical; }
  .fill-phone { background: #fff; color: var(--ink); border-radius: 16px; padding: 14px; font-size: 1.15em; font-weight: 600; line-height: 2.1; text-align: center; }
  .slot { min-width: 3.4em; border: 0; border-bottom: 3px solid var(--d); background: #f1edf8; color: var(--d); font-weight: 700; border-radius: 8px 8px 0 0; padding: 2px 8px; margin: 0 3px; font-size: .95em; }
  .slot.filled { background: #ede9fe; color: var(--ink); }
  .wbank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .wchip { background: #fff; color: var(--ink); border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 1.05em; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .wchip:active { transform: translateY(2px); }
  .list-names { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .name-btn { width: 100%; font-size: 1.1em; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .person { background: rgba(255,255,255,.14); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font-weight: 600; text-align: center; line-height: 1.15; transition: transform .15s, background .15s; }
  .person:active { transform: scale(.95); }
  .person:hover { background: rgba(255,255,255,.24); }
  .person.taken { opacity: .45; }
  .person small { font-weight: 400; opacity: .8; }
  .bar { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.2); padding: 8px 12px; border-radius: 16px; margin-right: 52px; }
  .bar .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { background: #ffd93d; color: var(--ink); padding: 4px 12px; border-radius: 999px; font-weight: 700; }
  .qmeta { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 6px; opacity: .85; }
  .qmeta span:first-child { white-space: nowrap; }
  .qmeta span:last-child { text-align: right; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .qtext { background: #fff; color: var(--ink); border-radius: 16px; padding: 16px; font-size: 1.25em; font-weight: 600; text-align: center; }
  .qimg { max-width: 100%; max-height: 28vh; border-radius: 12px; margin: 10px auto 0; display: block; }
  .timebar { height: 10px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; margin: 12px 0; }
  .timebar div { height: 100%; background: #ffd93d; width: 100%; transform-origin: left; }
  .answers { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); flex: 1; align-content: stretch; }
  .answers.n2, .answers.long { grid-template-columns: minmax(0, 1fr); }
  .answers.long .ans { min-height: 64px; }
  .ans, .qtext, .rv-item, .wchip, .slot { overflow-wrap: anywhere; min-width: 0; }
  .ans { color: #fff; border-radius: 18px; padding: 16px 12px; font-size: 1.15em; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 110px; box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .1s; }
  .ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .ans .letter { font-size: 1.1em; }
  .result { border-radius: 24px; padding: 28px 18px; width: 100%; }
  .result.ok { background: var(--ok); }
  .result.bad { background: var(--bad); }
  .result.part { background: var(--c); }
  .result.none { background: rgba(0,0,0,.25); }
  .result h2 { font-size: 2.2em; margin: 6px 0; }
  .correct-box { background: rgba(255,255,255,.95); color: var(--ink); padding: 12px 16px; border-radius: 14px; margin-top: 12px; font-weight: 600; }
  .bounce { animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  .ready-n { width: 120px; height: 120px; border-radius: 50%; background: #ffd93d; color: var(--ink); display: grid; place-items: center; font-size: 3.6em; font-weight: 700; box-shadow: 0 0 0 12px rgba(255,217,61,.25); }
  .dancer { --s: .8; }
  .dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<main>
  <div id="app" class="screen"></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script src="crossword.js"></script>
<script src="qtypes.js"></script>
<script src="sound.js"></script>
<script>
// Volume baixo nos telemóveis: o formador não controla o som dos dispositivos dos alunos
Sound.setVolume(0.2);
muteButton();
const app = $('#app');
// código da sessão: vem no QR code (?c=XXXXXX) ou é escrito à mão
const CODE = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const socket = io({ auth: { role: 'player', code: CODE } });
let roster = null, state = null, lastKey = '', timerRaf = null;
let joinStep = { kind: 'form' }; // form | notFound | rejoin
let typed = '';
const stored = () => { try { return JSON.parse(localStorage.getItem('aq_me') || 'null'); } catch { return null; } };
const store = v => { try { v ? localStorage.setItem('aq_me', JSON.stringify(v)) : localStorage.removeItem('aq_me'); } catch {} };

socket.on('connect', () => { state = null; });
socket.on('roster', r => {
  roster = r;
  const me = stored();
  if (r.session && me && me.sessionId === r.session.id && !state) return reclaim(me);
  if (!state) render();
});
socket.on('state', s => { if (!s.session) { state = null; roster = null; render(); return; } state = s; render(); });
socket.on('reload', () => { state = null; joinStep = { kind: 'form' }; store(null); });
socket.on('released', () => { state = null; store(null); joinStep = { kind: 'form' }; toast('O formador libertou o teu lugar. Para voltar, usa o código de reentrada que ele te der.', 6000); render(); });

function joined(res) {
  if (res.error) {
    // no formulário do nome, a explicação fica escrita por baixo do campo (não desaparece)
    if (joinStep.kind === 'form' && !(state && state.me)) { joinStep = { kind: 'form', msg: res.error }; lastKey = ''; render(); setTimeout(() => { const n = $('#nm'); if (n) { n.focus(); n.select(); } }, 60); return; }
    toast(res.error, 5000); lastKey = ''; render(); return;
  }
  store({ sessionId: res.sessionId, studentId: res.studentId, token: res.token });
  joinStep = { kind: 'form' };
  Sound.play('pop');
}
// mesmo dispositivo: volta a entrar sozinho com o token guardado
function reclaim(me) {
  socket.emit('player:claim', { studentId: me.studentId, token: me.token }, res => { if (res.error) { store(null); render(); } else joined(res); });
}
function join() {
  Sound.init();
  socket.emit('player:join', { name: typed }, res => {
    if (res.notFound) { joinStep = { kind: 'notFound' }; return render(); }
    joined(res);
  });
}

const logo = () => `<div class="logo">🎯 <span>Quiz</span></div>
  <p class="center" style="margin:4px 0 0;opacity:.9">${roster.session.courseName ? esc(roster.session.courseName) + ' · ' : ''}${esc(roster.session.quizTitle)}</p>`;

function codeForm(msg) {
  return set('code' + msg, `<div class="logo">🎯 <span>Quiz</span></div>
    <form class="middle" id="codeForm" autocomplete="off"><div class="big-emoji">🔑</div>
      <h1 style="font-size:1.5em">Código da sessão</h1>
      <p>${msg}</p>
      <input class="search code-in" id="cd" maxlength="6" placeholder="ex.: K7P4QX" autocapitalize="characters" enterkeyhint="go" required>
      <button class="btn primary" style="width:100%;font-size:1.15em">Continuar</button></form>`, () => {
    $('#codeForm').onsubmit = e => { e.preventDefault(); const c = $('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c) location.search = '?c=' + c; };
  });
}

function render() {
  cancelAnimationFrame(timerRaf);
  if (state && state.session) return renderGame();
  if (!CODE) return codeForm('Lê o QR code no ecrã do formador ou escreve o código que aparece por baixo dele.');
  if (!roster) return;
  if (!roster.session) {
    if (roster.badCode) return codeForm(`O código <b>${esc(CODE)}</b> não corresponde a nenhuma sessão aberta. Lê de novo o QR code ou confirma o código.`);
    return set('wait', `<div class="logo">🎯 <span>Quiz</span></div>
      <div class="middle"><div class="big-emoji wiggle">🎮</div><h1>Quase lá!</h1><p>À espera que o formador abra a sessão<span class="dots"></span></p></div>`);
  }
  if (joinStep.kind === 'notFound') {
    return set('nf' + typed, logo() + `<div class="middle"><div class="big-emoji">🤔</div>
      <h1 style="font-size:1.4em">Não encontrámos “${esc(typed)}” na lista da turma</h1>
      <p>Escreve o teu <b>nome completo</b>, tal como está na inscrição.<br>Se estiver certo, fala com o formador.</p>
      <button class="btn primary" id="retry">✏️ Corrigir o nome</button></div>`, () => {
      $('#retry').onclick = () => { joinStep = { kind: 'form' }; render(); };
    });
  }
  if (joinStep.kind === 'rejoin') {
    return set('rejoin', logo() + `<form class="middle" id="rjForm" autocomplete="off"><div class="big-emoji">🔢</div>
      <h1 style="font-size:1.4em">Código de reentrada</h1><p>O formador vê-o no ecrã dele quando liberta o teu nome.</p>
      <input class="search code-in" id="rjc" inputmode="numeric" maxlength="4" placeholder="0000" required>
      <button class="btn primary" style="width:100%">Voltar ao meu lugar</button>
      <button type="button" class="btn ghost" id="retry">← Voltar</button></form>`, () => {
      $('#rjForm').onsubmit = e => { e.preventDefault(); socket.emit('player:rejoin', { rejoin: $('#rjc').value }, joined); };
      $('#retry').onclick = () => { joinStep = { kind: 'form' }; render(); };
    });
  }
  if (roster.session.anonymous) {
    // questionário anónimo: não se pede o nome
    return set('anon', logo() + `<div class="middle"><div class="big-emoji wiggle">🕶️</div>
      <h1 style="font-size:1.6em">Questionário anónimo</h1>
      <p>Não precisas de dizer quem és: as tuas respostas não ficam associadas ao teu nome — nem o formador sabe quem respondeu o quê.</p>
      <button class="btn primary" id="anonGo" style="width:100%;font-size:1.15em">Entrar 🚀</button></div>`, () => {
      $('#anonGo').onclick = () => { Sound.init(); socket.emit('player:join', { name: '' }, joined); };
    });
  }
  set('form' + (joinStep.msg || ''), logo() + `<form class="middle" id="joinForm" autocomplete="off">
      ${joinStep.msg ? '' : '<div class="big-emoji wiggle">👋</div>'}
      <h1 style="font-size:1.6em">Escreve o teu nome completo</h1>
      <input class="search" id="nm" name="nome" placeholder="Nome completo" maxlength="80" autocapitalize="words" enterkeyhint="go" required value="${esc(typed)}">
      ${joinStep.msg ? `<p class="join-err" role="alert">⚠️ ${esc(joinStep.msg)}</p>` : ''}
      <button class="btn primary" style="width:100%;font-size:1.15em">Entrar 🚀</button>
      <button type="button" class="btn ghost" id="rj" style="font-size:.9em">Mudei de telemóvel: tenho um código de reentrada</button>
    </form>`, () => {
    const nm = $('#nm');
    nm.oninput = () => typed = nm.value;
    $('#joinForm').onsubmit = e => { e.preventDefault(); typed = nm.value.trim(); if (typed) join(); };
    $('#rj').onclick = () => { joinStep = { kind: 'rejoin' }; render(); };
    setTimeout(() => nm.focus(), 50);
  });
}

  photo.step = 'camera'; photo.fallback = false; lastKey = ''; render();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sem câmara');
    photo.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } }, audio: false });

function capture() {

// ---------- Modo tempo total: todas as perguntas, ao seu ritmo ----------
let exIdx = 0, exConfirm = false, exClock = null, exWarned = false;
function exClockStart() {

  const f = () => {
    const el = $('#exClock'); if (!el) return;
    const r = Math.max(0, end - performance.now()), m = Math.floor(r / 60000), sec = Math.floor(r / 1000) % 60;
    el.textContent = `⏳ ${m}:${String(sec).padStart(2, '0')}`;
    el.classList.toggle('hurry', r < 60000);

  };
  f(); exClock = setInterval(f, 250);
}
function renderExam() {

      <p style="opacity:.85">Depois de entregar já não podes mudar as respostas.</p>

    <div class="ex-chips">${ex.questions.map((_, i) => `<button class="ex-chip ${ex.mine[i] != null ? 'done' : ''} ${i === exIdx ? 'cur' : ''}" data-go="${i}">${i + 1}</button>`).join('')}</div>

      ${exIdx < n - 1 ? `<button class="btn ghost" id="exNext">Seguinte →</button>` : `<button class="btn primary" id="exEnd">Rever e entregar ✅</button>`}</div>
    ${exIdx < n - 1 ? `<button class="btn ghost ex-submit-link" id="exEnd">Entregar</button>` : ''}`, () => {

const isOpinion = q => { const t = (q && q.type) || 'mc'; return t === 'scale' || t === 'cloud' || (t === 'rank' && !q.ordered); };
const optLabel = (opts, i) => opts && opts[i] ? `${LETTERS[i]}) ${esc(opts[i])}` : LETTERS[i];
const onScreenNote = `<div class="on-screen pop-in">👀 A pergunta e as opções estão no <b>ecrã do formador</b>.<br>Responde aqui com a letra.</div>`;

// Origem do texto colado, pelos metadados da área de transferência (versão HTML que acompanha o texto).
// Só guarda o nome da origem; o HTML em si nunca é enviado.
function pasteOrigin(html) {
  if (!html) return null;
  const h = html.toLowerCase();
  if (/data-start="\d+"[^>]*data-end="\d+"/.test(h) || h.includes('chatgpt') || h.includes('data-message-author-role') || h.includes('markdown prose')) return 'chatgpt';
  if (h.includes('gemini') || h.includes('model-response') || h.includes('markdown-main-panel')) return 'gemini';
  if (h.includes('claude.ai') || h.includes('font-claude') || h.includes('standard-markdown')) return 'claude';
  if (h.includes('copilot') || h.includes('cib-serp') || h.includes('ac-textblock')) return 'copilot';
  if (h.includes('perplexity')) return 'perplexity';
  if (h.includes('deepseek')) return 'deepseek';

}
// quantas vezes o formando saiu da app (mudou de separador/app) — usado nos sinais das respostas livres
let hiddenCount = 0;

// Desenha a forma de responder conforme o tipo. cur = resposta atual (modo tempo total).

function answerWidget(q, cur, exam) {

    return {
      html: `<div class="cloud-in">${Array.from({ length: n }, (_, i) => `<input class="search cloud-w" maxlength="30" autocomplete="off" autocapitalize="none" enterkeyhint="${i < n - 1 ? 'next' : 'send'}" placeholder="${n > 1 ? `Palavra ${i + 1}${i ? ' (opcional)' : ''}` : 'A tua palavra'}" value="${esc(vals[i] || '')}">`).join('')}</div>

        $('#cloudSend').onclick = () => { const w = ins.map(x => x.value.trim()).filter(Boolean); if (!w.length) return toast('Escreve pelo menos uma palavra.'); on(w, $('#cloudSend')); };
      },
    };
  }

    let tries = g0.tries.slice(), done = !!g0.done, solved = !!g0.solved, typed = '', busy = false;
    const L = q.len, at = exam ? exIdx : null;
    const keyState = () => { const st = {}, rk = { r: 1, y: 2, g: 3 }; tries.forEach(tr => [...tr.word].forEach((ch, i) => { const c = tr.colors[i]; if (!st[ch] || rk[c] > rk[st[ch]]) st[ch] = c; })); return st; };

        const send = () => {
          if (typed.length < L) { const row = $('#gw .gw-row.cur'); if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); } return toast(`A palavra tem ${L} letras`); }

              setTimeout(() => { if (exIdx !== at) return; const nf = state.exam.questions.findIndex((_, i) => i > at && state.exam.mine[i] == null); if (nf >= 0) exIdx = nf; render(); }, 1600);

    const html = () => { let k = 0;

      bind: on => {

      bind: on => {
        const refresh = () => { $$('.slot').forEach(sl => { const i = +sl.dataset.b; sl.textContent = vals[i] || (i + 1); sl.classList.toggle('filled', !!vals[i]); }); $('#fillSend').disabled = !vals.every(Boolean); };
        $$('.wchip').forEach(c => c.onclick = () => { const i = vals.findIndex(v => !v); if (i < 0) return toast('Todos os espaços estão preenchidos: toca num para o trocar.'); vals[i] = c.dataset.w; Sound.play('pop'); refresh(); });
        $$('.slot').forEach(sl => sl.onclick = () => { vals[+sl.dataset.b] = null; refresh(); });
        $('#fillSend').onclick = () => on(vals.slice(), $('#fillSend'));
      },
    };
  }
  // escolha múltipla / verdadeiro-falso
  return {
    html: `<div class="answers ${exam ? 'ex-answers' : ''} ${q.options.length === 2 ? 'n2' : ''} ${!q.hidden && q.options.some(o => String(o).length > 38) ? 'long' : ''} ${q.hidden ? 'letters-only' : ''}">${q.options.map((o, i) => `<button class="ans opt-${i} ${exam ? (cur === i ? 'sel' : cur != null ? 'unsel' : '') : 'pop-in'}" style="animation-delay:${i * 70}ms" data-i="${i}"><span class="letter">${LETTERS[i]}</span>${esc(o)}</button>`).join('')}</div>`,
    bind: on => $$('.answers .ans').forEach(b => b.onclick = () => on(+b.dataset.i, b)),
  };
}
// quadro do "adivinha a palavra": linhas já tentadas (com cores), a linha a escrever e as vazias
function guessBoardHtml(q, tries, typed, live) {
  const L = q.len, rows = [];
  for (let r = 0; r < q.maxTries; r++) {
    const tr = tries[r], cur = live && r === tries.length;
    if (!live && !tr) continue;
    rows.push(`<div class="gw-row ${cur ? 'cur' : ''}">${Array.from({ length: L }, (_, i) => {
      const ch = tr ? tr.word[i] : cur ? (typed[i] || '') : '';
      return `<span class="gw-c ${tr ? tr.colors[i] + ' flip' : ch ? 'typed' : ''}" style="${tr ? `animation-delay:${i * 90}ms` : ''}">${esc(ch)}</span>`; }).join('')}</div>`);
  }
  return `<div class="gw" style="--len:${L}">${rows.join('')}</div>`;
}
// resumo da resposta dada, para mostrar depois de enviar
function answerSummary(q, v) {
  const t = q.type || 'mc';
  if (v == null) return '';
  if (t === 'scale') return `⭐ ${v} de 5`;
  if (t === 'fill') return (v || []).join(' · ');
  if (t === 'open') return `“${esc(v)}”`;
  if (t === 'cloud') return '☁️ ' + (v || []).map(esc).join(' · ');
  if (t === 'scramble') return `<b style="font-size:1.4em;letter-spacing:.08em">${esc(String(v).toUpperCase())}</b>`;
  if (t === 'guess') return (v || []).map(esc).join(' → ');
  if (t === 'cross') return `<div style="text-align:left">${q.cross.words.map((w, k) => `${w.n}${w.dir === 'a' ? '→' : '↓'} ${esc((v || [])[k] || '—')}`).join('<br>')}</div>`;
  if (t === 'rank') { const txt = i => { const it = (q.items || []).find(x => x.i === i); return it ? (it.text ? esc(it.text) : it.letter) : '?'; }; return `<div style="text-align:left">${(v || []).map((i, k) => `${k + 1}º ${txt(i)}`).join('<br>')}</div>`; }
  return optLabel(q.options, v);
}

function qmeta() { const s = state.session; return `<div class="qmeta"><span>Pergunta ${s.qIndex + 1} de ${s.total}</span><span>${esc(s.quizTitle)}</span></div>`; }
render();
</script>
