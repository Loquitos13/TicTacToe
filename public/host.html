<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Formador</title>
<link rel="stylesheet" href="common.css">
<style>
  nav { display: flex; gap: 6px; align-items: center; padding: 10px 16px; background: rgba(0,0,0,.25); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  nav .logo { font-weight: 700; font-size: 1.4em; margin-right: 14px; } nav .logo span { color: #ffd93d; }
  nav button { background: transparent; color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 500; }
  nav button.on { background: #fff; color: var(--ink); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .card h2 { margin-top: 0; }
  label { font-weight: 500; }
  input[type=text], input[type=password], input[type=number], input[type=url], select, textarea { padding: 10px 12px; border: 2px solid #e5e0ef; border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--d); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; background: #f6f3fb; }
  .item .avatar { border-color: #fff; }
  .switch { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
  .switch input { width: 20px; height: 20px; accent-color: var(--d); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow: auto; padding: 4px; }
  .chip { display: flex; gap: 6px; align-items: center; background: #f1edf8; border-radius: 999px; padding: 4px 10px 4px 4px; font-size: .9em; cursor: pointer; }
  .chip input { accent-color: var(--d); }

  /* ----- Palco (projetor) ----- */
  #stage { min-height: calc(100vh - 60px); display: flex; flex-direction: column; padding: 18px 24px 140px; }
  #offline { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: #dc2626; color: #fff; text-align: center; font-weight: 700; padding: 8px; }
  body.offline #offline { display: block; } body.offline .controls { opacity: .45; pointer-events: none; }
  .stage-top { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; opacity: .9; padding-right: 50px; }
  /* modo diapositivo (PowerPoint): sem menu; controlos mínimos, discretos, por baixo */
  body.slide nav, body.slide .mute-btn { display: none; }
  /* o palco desenha-se sempre a 1280×720 e é encolhido para caber no diapositivo (ver fitSlide) */
  body.slide { overflow: hidden; }
  body.slide #main { width: 1280px; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  body.slide #main.hidden { display: none; }
  body.slide #stage { min-height: 720px; padding: 14px 22px 74px; box-sizing: border-box; }
  body.slide .controls { padding: 6px 10px; gap: 6px; background: rgba(20,10,40,.55); }
  body.slide .controls > :not(#btnNext):not(#btnClose):not(#btnEnd):not(.info):not(#sndMe):not(#sndAll):not(#slideNote):not(#slideRestart):not(#btnPlayers):not(#qrSw) { display: none; }
  #slideNote { font-weight: 800; color: #ffd93d; font-size: 1.05em; }
  body.slide .controls .info { font-size: .8em; }
  /* diapositivo a editar: pré-visualização e escolha do papel */
  #slidePrev { position: fixed; inset: 0; display: grid; place-items: center; padding: 3vw; overflow: auto; font-size: clamp(11px, 2.1vw, 26px); }
  .sp { text-align: center; max-width: 46em; display: flex; flex-direction: column; align-items: center; gap: .5em; }
  .sp h1 { margin: .1em 0; font-size: 2em; line-height: 1.15; } .sp h2 { margin: 0; } .sp p { margin: .2em 0; opacity: .9; }
  .sp-emoji { font-size: 3.5em; } .sp-where { font-size: .8em; opacity: .75; } .sp-warn { background: #fef3c7; color: #78350f; border-radius: 10px; padding: .3em .8em; } .sp-tag { background: rgba(255,255,255,.18); border-radius: 99px; padding: .25em .9em; font-weight: 700; }
  .sp-qr { width: 6em; height: 6em; border-radius: .6em; background: repeating-linear-gradient(45deg, #fff 0 .5em, #e5e7eb .5em 1em); color: #1f1147; display: grid; place-items: center; font-weight: 800; }
  .sp-form { background: #fff; color: var(--ink); border-radius: 18px; padding: 1.1em 1.4em; text-align: left; align-items: stretch; font-size: .8em; }
  .sp-form label { display: flex; flex-direction: column; gap: .2em; font-weight: 600; } .sp-form select { font-size: 1em; padding: .35em; }
  .sp-roles { display: flex; gap: 1em; flex-wrap: wrap; } .sp-roles label { flex-direction: row; align-items: center; gap: .3em; }
  #slideGo { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 60; font-size: 1.1em; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .slide-idle { align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .slide-idle .big-emoji { font-size: 4em; } .slide-idle p { max-width: 640px; opacity: .9; }
  .controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,10,40,.85); backdrop-filter: blur(8px); padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 30; }
  .controls .info { flex: 1; opacity: .85; min-width: 160px; }
  .lobby { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 30px; flex: 1; align-items: start; margin-top: 10px; }
  @media (max-width: 860px) { .lobby { grid-template-columns: 1fr; } }
  .qrbox { background: #fff; color: var(--ink); border-radius: 24px; padding: 22px; text-align: center; }
  .qrbox img { width: 100%; max-width: 340px; aspect-ratio: 1; }
  .code-label { margin-top: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .8em; }
  .code-big { font-size: 2.6em; font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .qrbox .url { font-size: 1.3em; font-weight: 700; word-break: break-all; margin-top: 8px; }
  .joined { display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; }
  .joined .p { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 110px; text-align: center; font-weight: 600; line-height: 1.1; }
  .joined .p.off { opacity: .35; }
  /* turmas grandes: cartões compactos para caberem todos num projetor de 1024x768 */
  .joined.many { gap: 6px 8px; } .joined.many .p { width: 64px; font-size: .78em; gap: 3px; } .joined.many .avatar.lg { width: 44px; height: 44px; font-size: 1em; border-width: 2px; }
  .joined.many .p span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .teams-lobby.many .tl-cols { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .teams-lobby.many .tl-col { padding: 6px; gap: 3px; } .teams-lobby.many .tl-head { font-size: .9em; white-space: nowrap; gap: 4px; }
  .teams-lobby.many .tl-p { min-height: 0; padding: 2px 6px; gap: 5px; font-size: .85em; border-radius: 8px; } .teams-lobby.many .tl-p .avatar.sm { width: 22px; height: 22px; font-size: .6em; border-width: 1px; }
  .count-big { font-size: 3.2em; font-weight: 700; }
  .question-title { background: #fff; color: var(--ink); border-radius: 24px; padding: 26px 30px; font-size: clamp(1.6em, 3.4vw, 3em); font-weight: 600; text-align: center; margin: 14px 0; line-height: 1.2; overflow-wrap: anywhere; }
  .question-title.long { font-size: clamp(1.3em, 2.4vw, 2.2em); padding: 18px 24px; }
  .question-title.xlong { font-size: clamp(1.15em, 1.9vw, 1.8em); padding: 16px 22px; }
  .opts.long .opt { font-size: clamp(1em, 1.5vw, 1.35em); padding: 14px 18px; min-height: 70px; }
  .num-stage { width: 100%; max-width: 1000px; margin: 34px auto 10px; padding: 0 30px; box-sizing: border-box; position: relative; }
  .num-track { height: 16px; border-radius: 9px; background: rgba(255,255,255,.25); position: relative; }
  .num-track i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: #ffd93d; color: var(--ink); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 1.6em; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .num-ticks { position: relative; height: 1.6em; margin-top: 22px; font-size: 1.7em; font-weight: 800; }
  .num-ticks span { position: absolute; transform: translateX(-50%); }
  .num-hist { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 34vh; margin: 10px auto 0; width: 100%; max-width: 1100px; }
  .match-left { background: rgba(255,255,255,.16); } .match-left .letter { background: rgba(255,255,255,.25); }
  .num-col { flex: 1 1 0; max-width: 90px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 1.5em; font-weight: 700; }
  .num-bar { width: 100%; min-height: 4px; background: #7dd3fc; border-radius: 8px 8px 0 0; }
  .num-col.right .num-bar { background: #22c55e; } .num-col.right span { color: #86efac; font-weight: 800; }
  .match-stage { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .match-stage.sol { grid-template-columns: 1fr auto 1fr; gap: 12px 14px; align-items: stretch; }
  .match-arrow { display: grid; place-items: center; font-size: 2.2em; font-weight: 800; color: #86efac; }
  .match-stage.sol .match-left.right { box-shadow: 0 0 0 3px #22c55e; } .match-col { display: grid; gap: 12px; align-content: start; }
  .spot-stage, .spotEd { position: relative; width: fit-content; max-width: 100%; margin: 6px auto; line-height: 0; }
  .spot-stage img { max-height: 52vh; max-width: 100%; border-radius: 12px; display: block; }
  .spot-stage.compact img { max-height: 40vh; }
  .spotEd { margin: 0; cursor: crosshair; touch-action: none; user-select: none; } .spotEd img { max-width: 100%; max-height: 420px; border-radius: 8px; display: block; pointer-events: none; }
  .spot-zone { position: absolute; border: 3px solid #22c55e; background: rgba(34,197,94,.25); border-radius: 6px; pointer-events: none; }
  .spot-zone b { position: absolute; top: -12px; left: -12px; width: 24px; height: 24px; border-radius: 50%; background: #22c55e; color: #fff; font-size: 14px; line-height: 24px; text-align: center; }
  .explain-box { max-width: 1100px; margin: 14px auto 0; background: #fff8dc; color: #3b2f00; border-radius: 14px; padding: 12px 18px; font-size: 1.35em; text-align: center; }
  .spot-dot { position: absolute; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: #ffd93d; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .spot-dot.ok { background: #22c55e; } .spot-dot.bad { background: #ef4444; }
  .key-spot .spot-stage img { max-height: 320px; }
  .mini-qr { position: fixed; left: 14px; bottom: 78px; z-index: 25; background: #fff; border-radius: 12px; padding: 6px 6px 4px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .mini-qr img { width: 112px; height: 112px; display: block; } .mini-qr b { display: block; color: var(--ink); font-size: 15px; letter-spacing: .12em; }
  .qimage { max-height: 32vh; max-width: 70%; border-radius: 16px; display: block; margin: 0 auto 14px; }
  .qmid { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 10px 0 18px; }
  .ring { width: 130px; height: 130px; position: relative; flex: none; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.8em; font-weight: 700; }
  .ring.hurry .n { color: #ffd93d; animation: pulse .5s infinite; }
  .answered-box { text-align: center; } .answered-box b { font-size: 3em; display: block; line-height: 1; }
  .opts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .opt { border-radius: 20px; padding: 20px 22px; font-size: clamp(1.1em, 2vw, 1.7em); font-weight: 600; display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden; transition: opacity .4s, transform .4s; min-height: 90px; }
  .opt .letter { font-size: 1.1em; }
  .opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; position: relative; z-index: 1; }
  .opt .cnt { font-size: 1.4em; font-weight: 700; position: relative; z-index: 1; }
  .opt .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.22); width: 0; transition: width 1s cubic-bezier(.2,.9,.3,1); }
  .opt.dim { opacity: .35; transform: scale(.97); }
  .opt.right { box-shadow: 0 0 0 6px #fff, 0 0 40px rgba(255,255,255,.7); animation: popIn .6s both; }
  .opt .tick { font-size: 1.6em; position: relative; z-index: 1; }
  .opt .who { display: flex; flex-wrap: wrap; gap: 4px; position: relative; z-index: 1; }
  .opt.has-who { flex-wrap: wrap; }
  .opt.has-who .who { flex-basis: 100%; }
  .modes { display: grid; gap: 8px; }
  .times { display: flex; flex-direction: column; gap: 10px; background: #f6f3fb; border-radius: 14px; padding: 12px; }
  .times label { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .times-grid { display: flex; flex-direction: column; gap: 8px; }
  .num-in input { width: 74px; text-align: center; }
  .mode { display: flex; gap: 10px; align-items: flex-start; border: 2px solid #e5e0ef; border-radius: 14px; padding: 12px; cursor: pointer; }
  .mode:has(input:checked) { border-color: var(--d); background: #f5f0ff; }
  .mode input { margin-top: 4px; accent-color: var(--d); width: 18px; height: 18px; }
  .mode b { display: block; font-size: 1.05em; } .mode small { color: var(--muted); }
  .live-pill { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.25); padding: 12px 20px; border-radius: 999px; font-size: 1.3em; font-weight: 600; flex: none; }
  .live-pill .dot { width: 14px; height: 14px; border-radius: 50%; background: #ff4d6d; animation: pulse 1s infinite; box-shadow: 0 0 12px #ff4d6d; }
  .progress-wrap { flex: 1; max-width: 520px; text-align: center; }
  .progress { height: 16px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
  .progress div { height: 100%; background: linear-gradient(90deg, #6bcb77, #ffd93d); border-radius: 99px; transition: width .5s cubic-bezier(.2,.9,.3,1.2); }
  .all-done { margin-top: 10px; font-size: 1.4em; font-weight: 700; animation: popIn .5s both; }

  .timeup { position: fixed; inset: 0; display: grid; place-items: center; font-size: clamp(3em, 9vw, 7em); font-weight: 700; background: rgba(43,16,85,.85); z-index: 40; animation: timeup 1.8s ease forwards; pointer-events: none; }
  @keyframes timeup { 0% { opacity: 0; transform: scale(1.4); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  .opt.right-private { outline: 4px dashed #ffd93d; outline-offset: 3px; }
  .private-note { margin-top: 10px; display: inline-block; width: 100%; color: #ffd93d; font-weight: 600; }
  .answers-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; max-width: 1200px; width: 100%; margin: 0 auto; }
  .al-item { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px 18px; }
  .al-q { font-weight: 600; font-size: 1.15em; margin-bottom: 8px; }
  .al-a { font-weight: 700; font-size: 1.15em; display: flex; flex-direction: column; gap: 6px; }
  .al-a .letter { color: #fff; margin-right: 6px; }
  .exam-top { text-align: center; margin: 10px 0 6px; }
  .exam-clock { font-size: clamp(4em, 11vw, 8em); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .exam-clock.hurry { color: #ffd93d; animation: pulse 1s infinite; }
  .exam-sub { font-size: 1.3em; opacity: .9; }
  .exam-stats { display: flex; justify-content: center; gap: 24px; font-size: 1.3em; font-weight: 600; margin: 8px 0 18px; }
  .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

  .ex-card.done { background: rgba(34,197,94,.35); }
  .ex-card.off { opacity: .5; }

  .ex-bar div { height: 100%; background: #ffd93d; transition: width .4s; }
  .phones-note { background: rgba(255,217,61,.18); border: 2px solid #ffd93d; border-radius: 14px; padding: 8px 14px; text-align: center; font-size: 1.05em; margin: 6px 0; }
  .fill-sentence { background: #fff; color: var(--ink); border-radius: 20px; padding: 22px 26px; font-size: clamp(1.3em, 2.6vw, 2.1em); font-weight: 600; line-height: 1.9; text-align: center; margin: 6px 0 14px; }
  .blank { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--d); color: var(--d); text-align: center; margin: 0 4px; padding: 0 6px; line-height: 1.3; }
